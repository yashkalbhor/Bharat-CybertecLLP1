<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Career Application | Bharat Cybertec LLP</title>

<link rel="stylesheet" href="../assets/css/career-form.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<section class="application-page">

<div class="form-container">

<div class="form-title">

<h1>Join Bharat Cybertec LLP</h1>

<p>
Complete the application form below and our recruitment
team will contact you if your profile matches our requirements.
</p>

</div>

<form>

<h2>Personal Information</h2>

<div class="grid-2">

<input type="text" placeholder="First Name" required>

<input type="text" placeholder="Last Name" required>

<input type="email" placeholder="Email Address" required>

<input type="tel" placeholder="Phone Number" required>

<input type="text" placeholder="City">

<input type="text" placeholder="State">

</div>

<h2>Professional Information</h2>

<div class="grid-2">

<select required>

<option>Select Position</option>

<option>Java Full Stack Developer</option>

<option>Cyber Security Analyst</option>

<option>React Frontend Developer</option>

</select>

<select>

<option>Experience</option>

<option>Fresher</option>

<option>1 Year</option>

<option>2 Years</option>

<option>3+ Years</option>

</select>

<input type="text" placeholder="Expected Salary">



<input type="text" placeholder="Notice Period">


</select>

</div>

<h2>Education</h2>

<div class="grid-2">

    <input type="text" placeholder="Highest Qualification">

<input type="text" placeholder="College / University">

</div>

<h2>Skills</h2>

<div class="grid-2">

<input type="text"
placeholder="Programming Skills">

<input type="text"
placeholder="Technical Skills">

</div>

<h2>Upload Documents</h2>

<div class="grid-2">

<input type="file" accept=".pdf">

<input type="file" accept=".pdf">

</div>

<h2>About Yourself</h2>

<textarea
placeholder="Tell us about yourself..."
rows="10"></textarea>

<label class="check">

<input type="checkbox" required>

I agree to the Privacy Policy.

</label>

<button type="submit">

Submit Application

</button>

</form>
<div class="back-btn-wrapper">

    <a href="career.html" class="back-btn">

        <i class="fa-solid fa-arrow-left"></i>

        Back to Careers

    </a>

</div>

</div>

</section>

</body>

</html>
